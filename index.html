<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I lowk have a question</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            color: #d11a5b;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }
        .gif-container img {
            max-width: 200px;
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            gap: 20px;
            position: relative;
            width: 300px;
            height: 50px;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        #yesBtn:hover {
            background-color: #ff758f;
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #a3a3a3;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>

    <h1 id="question">DO YOU THINK IM AMAZING</h1>

    <div class="btn-container">
        <button id="yesBtn" onclick="celebrate()">Yes</button>
        <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            
            // Calculate random positions within the screen boundaries
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            
            // Reposition the button absolutely on the screen
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function celebrate() {
            // Change the heading and hide the buttons when they click Yes
            document.getElementById('question').innerHTML = "we know";
            document.getElementById('yesBtn').style.display = 'none';
            document.getElementById('noBtn').style.display = 'none';
        }
    </script>

</body>
</html>
